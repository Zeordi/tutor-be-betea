name: Deploy Admin

# Manual only until Vercel secrets + project are fully connected
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Admin (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require Vercel secrets
        run: |
          if [ -z "\( {{ secrets.VERCEL_TOKEN }}" ] || [ -z " \){{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" ]; then
            echo "Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID_ADMIN — skip deploy."
            exit 1
          fi

      - name: Deploy Admin to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: ./
          vercel-args: "--prod"