name: Deploy API

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy hook
        run: |
          if [ -z "${{ secrets.API_DEPLOY_HOOK_URL }}" ]; then
            echo "API_DEPLOY_HOOK_URL not set — configure Railway/Render/Fly hook first."
            exit 1
          fi

      - name: Trigger deploy hook
        run: curl -fsS -X POST "${{ secrets.API_DEPLOY_HOOK_URL }}"