name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - "packages/validators/**"
      - "packages/encryption/**"
      - "packages/audit/**"
      - "packages/geo/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  notice:
    name: API hosts on Render (no Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Skip Vercel API deploy
        run: |
          echo "API is deployed on Render: https://tutor-be-betea.onrender.com"
          echo "Link the Render web service to this GitHub repo for auto-deploy on push."
          echo "Secrets (DATABASE_URL, JWT_SECRET, AFROMESSAGE_*, Redis, etc.) live on Render → Environment."
          echo "No VERCEL_PROJECT_ID_API or Vercel deploy step is required."