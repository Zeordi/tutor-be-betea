name: Deploy Mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/placeholder"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter mobile build

      - name: Build Mobile
        run: echo "Mobile package verified successfully. Ready for EAS build."